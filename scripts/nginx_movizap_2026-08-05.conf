# MoviZap — movizap.movisat.com.br  ->  127.0.0.1:8008 (painel proprio)
#
# 2026-08-05: o dominio deixou de apontar para o Chatwoot (127.0.0.1:3000) e
# passou a servir o painel proprio. Decisao do usuario, com o Chatwoot em
# desativacao.
#
# O Chatwoot continua rodando na :3000 e a integracao Evolution->Chatwoot e
# interna: trocar este bloco nao a interrompe, apenas tira a TELA do Chatwoot
# desta URL. Para alcanca-la sem nginx:  ssh -L 3000:127.0.0.1:3000 vps
#
# Reverter e um comando: o bloco anterior esta em
# /etc/nginx/sites-available/movizap.movisat.com.br.conf.bak_2026-08-05

server {
    listen 80;
    listen [::]:80;
    server_name movizap.movisat.com.br www.movizap.movisat.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://movizap.movisat.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name movizap.movisat.com.br www.movizap.movisat.com.br;

    # Certificado ja existente, emitido para os dois nomes. Nada a reemitir.
    ssl_certificate     /etc/letsencrypt/live/movizap.movisat.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/movizap.movisat.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    if ($host = www.movizap.movisat.com.br) {
        return 301 https://movizap.movisat.com.br$request_uri;
    }

    # Fase 1 recebe midia do cliente (audio, foto, video, documento) pelo
    # webhook do Evolution.
    client_max_body_size 100m;

    access_log /var/log/nginx/movizap_access.log main;
    error_log  /var/log/nginx/movizap_error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Defesa em profundidade. O FastAPI ja recusa caminho que escapa do dist
    # (tests/teste_frontend.py cobre), mas as duas pontas custam nada.
    location ~ /\.(?!well-known) { deny all; access_log off; }
    location ~* \.(bak|old|orig|save|swp|tmp|py|db|sqlite3?|env)$ { deny all; access_log off; }
    location ~* \.bak_[0-9-]+[a-z]?$ { deny all; access_log off; }

    location / {
        proxy_pass            http://127.0.0.1:8008;
        proxy_http_version    1.1;
        # a caixa de entrada ao vivo vai usar WebSocket
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        "upgrade";
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_read_timeout    300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
    }
}
