# ligacoesmicrosip.movisat.com.br  ->  127.0.0.1:8010 (agente de ligações)
# ----------------------------------------------------------------------------
# Plano 5.1 (25/09). Pedido dele: "talvez usar uma porta para o serviço? com
# o shell autenticado? uma saída segura que poderia ter o nginx específico
# para não misturar outro?". E, nas decisões: há PC FORA do escritório.
#
# O QUE ESTE SITE FAZ (e só isso):
#   · Exige CERTIFICADO DE CLIENTE emitido pela CA própria dos agentes
#     (/home/claude/movizap_ligacoes_ca; aqui só o certificado PÚBLICO dela).
#     Sem certificado válido, o nginx recusa antes de chegar ao app.
#   · Repassa o certificado ao app (X-Cliente-Cert), que confere se ele é do
#     MESMO agente da chave (X-Agente-Chave). Revogar é uma linha no banco:
#     não precisa recarregar este arquivo.
#   · Só /agente/ responde. O resto: 404.
#   · Cota, log e limite de corpo PRÓPRIOS: um PC com lote atrasado nunca
#     rouba a cota do painel (mz_api), e o painel nunca derruba um envio.
#
# NÃO há allow/deny por IP: há PC fora do escritório (decisão dele, 25/09).
# ----------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=lig_agente:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ligacoesmicrosip.movisat.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # O agente só fala HTTPS. Nada de redirecionar: 404.
    location / {
        return 404;
    }
}

# FASE 1: so a porta 80, para o certbot emitir o certificado. Depois,
# o arquivo completo substitui este.
