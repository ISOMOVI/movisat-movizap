# ligacoesmicrosip.movisat.com.br  ->  127.0.0.1:8010 (agente de ligações)
# ----------------------------------------------------------------------------
# Plano 5.1 (25/09). Pedido dele: "talvez usar uma porta para o serviço? com
# o shell autenticado? uma saída segura que poderia ter o nginx específico
# para não misturar outro?". E, nas decisões: há PC FORA do escritório.
#
# O QUE ESTE SITE FAZ (e só isso):
#   · Exige CERTIFICADO DE CLIENTE emitido pela CA própria dos agentes
#     (/home/claude/movizap_ligacoes_ca; aqui só o certificado PÚBLICO dela).
#     Sem certificado válido, o nginx recusa antes de chegar ao app.
#   · Repassa o certificado ao app (X-Cliente-Cert), que confere se ele é do
#     MESMO agente da chave (X-Agente-Chave). Revogar é uma linha no banco:
#     não precisa recarregar este arquivo.
#   · Só /agente/ responde. O resto: 404.
#   · Cota, log e limite de corpo PRÓPRIOS: um PC com lote atrasado nunca
#     rouba a cota do painel (mz_api), e o painel nunca derruba um envio.
#
# NÃO há allow/deny por IP: há PC fora do escritório (decisão dele, 25/09).
# ----------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=lig_agente:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ligacoesmicrosip.movisat.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # O agente só fala HTTPS. Nada de redirecionar: 404.
    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ligacoesmicrosip.movisat.com.br;

    ssl_certificate     /etc/letsencrypt/live/ligacoesmicrosip.movisat.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ligacoesmicrosip.movisat.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # ── certificado de cliente (mTLS) ───────────────────────────────────
    ssl_client_certificate /etc/nginx/movizap_ligacoes_ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       1;

    # Gravação: teto de 25 MB no app; 30 aqui para caber o multipart.
    client_max_body_size 30m;

    access_log /var/log/nginx/ligacoesmicrosip_access.log mz_seguro;
    error_log  /var/log/nginx/ligacoesmicrosip_error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /agente/ {
        limit_req zone=lig_agente burst=20 nodelay;
        limit_req_status 429;
        proxy_pass            http://127.0.0.1:8010;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        # Sobrescreve o que o PC mandar com esse nome: não dá para forjar.
        proxy_set_header      X-Cliente-Cert    $ssl_client_escaped_cert;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 5s;
    }

    location / {
        return 404;
    }
}
